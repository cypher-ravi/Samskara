<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Samskara</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Samskara: sort the unspoken rules you grew up with, see where each one came from, and decide which beliefs are truly yours.">
<meta name="theme-color" content="#140E21">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23F6A640'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column set against a dusk sky; a low lamp-lit sun glows at the horizon and its light pools on glass cards. Rules you keep burn saffron, rules handed to you glow lotus-rose. */
:root{
  --sky-1:#140E21; --sky-2:#271433; --sky-3:#4A1D33; --sky-4:#7A3326; --sun:#FFB45C;
  --bg:#140E21;
  --glass:rgba(255,236,216,.075); --glass-2:rgba(255,236,216,.035); --glass-hi:rgba(255,245,235,.12);
  --ink:#F8EADB; --muted:#CBB0A8; --faint:#9C8491; --line:rgba(250,215,190,.17); --line-2:rgba(250,215,190,.32);
  --saffron:#F6A640; --saffron-soft:rgba(246,166,64,.17); --saffron-ink:#2A1224;
  --lotus:#EE8FAE; --lotus-soft:rgba(238,143,174,.16);
  --ash:#8D7B88; --well:rgba(12,6,16,.35);
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{background:var(--bg)}
body{background:linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 38%, var(--sky-3) 72%, var(--sky-4) 100%) fixed, var(--bg);
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.6; min-height:100vh; position:relative; overflow-x:hidden}
/* the setting sun and its reflection */
body::before{content:""; position:fixed; left:50%; bottom:-34vh; width:min(120vw,1100px); aspect-ratio:1; max-width:none; transform:translateX(-50%);
  background:radial-gradient(circle, rgba(255,190,110,.55) 0%, rgba(246,140,80,.28) 22%, rgba(200,80,90,.12) 42%, transparent 64%);
  pointer-events:none; z-index:0; animation:breathe 9s ease-in-out infinite}
body::after{content:""; position:fixed; inset:auto 0 0 0; height:26vh; pointer-events:none; z-index:0; opacity:.55;
  background:repeating-linear-gradient(180deg, rgba(255,200,140,.10) 0 1px, transparent 1px 9px);
  -webkit-mask-image:radial-gradient(60% 100% at 50% 100%, #000 10%, transparent 75%); mask-image:radial-gradient(60% 100% at 50% 100%, #000 10%, transparent 75%)}
@keyframes breathe{0%,100%{opacity:.85; transform:translateX(-50%) scale(1)} 50%{opacity:1; transform:translateX(-50%) scale(1.04)}}

.wrap{position:relative; z-index:1; max-width:660px; margin:0 auto; padding-inline:16px; padding-block:36px 64px; display:flex; flex-direction:column; gap:30px}
h1,h2,h3{font-family:var(--display); font-weight:400; margin:0; text-wrap:balance; line-height:1.12; letter-spacing:-.005em}
h1{font-size:clamp(32px,6.4vw,46px)}
h1 .glow{color:var(--saffron); text-shadow:0 0 28px rgba(246,166,64,.45)}
h2{font-size:27px}
h3{font-size:19px}
p{margin:0}
a{color:var(--saffron)}
.lede{color:var(--muted); max-width:56ch}
.label{font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
.brand{font-family:var(--display); font-size:20px; letter-spacing:.02em; color:var(--ink); display:inline-flex; align-items:center; gap:10px}
.brand .dot{width:10px; height:10px; border-radius:50%; background:var(--sun); box-shadow:0 0 14px 3px rgba(255,180,92,.6)}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible{outline:2px solid var(--saffron); outline-offset:2px}

header.top{display:flex; flex-direction:column; gap:14px}
.toprow{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.linkbtn{background:none; border:0; padding:4px 0; font-weight:600; color:var(--saffron); text-decoration:underline; text-decoration-color:rgba(246,166,64,.4); text-underline-offset:4px}
.privacy{font-size:13px; color:var(--faint)}

.ticks{display:flex; flex-wrap:wrap; gap:5px}
.tick{width:14px; height:5px; border-radius:3px; background:var(--line)}
.tick.mine{background:var(--saffron); box-shadow:0 0 8px rgba(246,166,64,.6)}
.tick.drop{background:var(--lotus); box-shadow:0 0 8px rgba(238,143,174,.5)}
.tick.unsure{background:var(--ash)} .tick.notme{background:var(--line); opacity:.5}
.tick.current{outline:1.5px solid var(--ink); outline-offset:2px}

.card{position:relative; background:linear-gradient(165deg, var(--glass-hi), var(--glass-2) 70%); border:1px solid var(--line); border-radius:20px;
  padding:26px 26px 22px; display:flex; flex-direction:column; gap:20px; overflow:hidden;
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 0 rgba(255,245,235,.14), 0 40px 70px -40px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.08)}
.card::after{content:""; position:absolute; left:-10%; right:-10%; bottom:-60%; height:90%; pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%, rgba(255,170,90,.16), transparent 70%)}
.card-top{display:flex; justify-content:space-between; gap:12px; position:relative; z-index:1}
.rule{position:relative; z-index:1; font-family:var(--display); font-size:clamp(27px,5.8vw,36px); line-height:1.18; text-wrap:balance; min-height:2.4em;
  text-shadow:0 0 30px rgba(255,200,150,.18)}
.stamps{position:relative; z-index:1; display:flex; flex-wrap:wrap; gap:8px; min-height:30px; align-items:center}
.stamp{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--lotus);
  border:1.5px solid var(--lotus); border-radius:4px; padding:3px 8px; transform:rotate(var(--r,-3deg));
  box-shadow:0 0 12px rgba(238,143,174,.25), inset 0 0 8px rgba(238,143,174,.12); animation:thud .24s ease-out}
.stamp.self{color:var(--saffron); border-color:var(--saffron); box-shadow:0 0 12px rgba(246,166,64,.3), inset 0 0 8px rgba(246,166,64,.14)}
.stamps .hint{font-size:13.5px; color:var(--faint); font-style:italic}
@keyframes thud{from{transform:rotate(var(--r,-3deg)) scale(1.4); opacity:0} to{transform:rotate(var(--r,-3deg)) scale(1); opacity:1}}

.q{display:flex; flex-direction:column; gap:10px}
.qtitle{font-weight:600}
.seg{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; padding:5px; background:var(--well); border:1px solid var(--line); border-radius:14px}
.seg button{background:transparent; border:0; border-radius:10px; padding:11px 6px; font-size:14px; font-weight:500; line-height:1.25; color:var(--muted); transition:background .2s, color .2s}
.seg button:hover{color:var(--ink); background:var(--glass)}
.seg button[aria-pressed="true"]{background:var(--saffron); color:var(--saffron-ink); font-weight:700; box-shadow:0 0 22px rgba(246,166,64,.4)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{background:var(--glass-2); border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:14px; color:var(--muted); transition:all .2s}
.chip:hover{border-color:var(--line-2); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--lotus-soft); border-color:var(--lotus); color:var(--ink); font-weight:600}
.chip.self[aria-pressed="true"]{background:var(--saffron-soft); border-color:var(--saffron)}
.choices{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.choice{background:var(--glass-2); border:1px solid var(--line); border-radius:14px; padding:13px 14px; text-align:left; display:flex; flex-direction:column; gap:4px; transition:all .2s}
.choice:hover{border-color:var(--line-2)}
.choice strong{font-size:15px}
.choice span{font-size:13px; color:var(--muted); line-height:1.4}
.choice[aria-pressed="true"].c-mine{border-color:var(--saffron); background:var(--saffron-soft); box-shadow:0 0 24px -6px rgba(246,166,64,.5)}
.choice[aria-pressed="true"].c-mine strong{color:var(--saffron)}
.choice[aria-pressed="true"].c-drop{border-color:var(--lotus); background:var(--lotus-soft); box-shadow:0 0 24px -6px rgba(238,143,174,.5)}
.choice[aria-pressed="true"].c-drop strong{color:var(--lotus)}
.choice[aria-pressed="true"].c-unsure{border-color:var(--ash); background:rgba(141,123,136,.18)}
@media (max-width:520px){ .seg{grid-template-columns:repeat(2,minmax(0,1fr))} .choices{grid-template-columns:1fr} }

.nav{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.btn{border-radius:999px; padding:12px 22px; font-weight:700; border:1px solid var(--saffron); background:var(--saffron); color:var(--saffron-ink); box-shadow:0 0 26px -4px rgba(246,166,64,.55); transition:transform .15s, box-shadow .2s}
.btn:hover:not(:disabled){transform:translateY(-1px); box-shadow:0 0 34px -2px rgba(246,166,64,.7)}
.btn:disabled{opacity:.3; cursor:not-allowed; box-shadow:none}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line-2); box-shadow:none; font-weight:600}
.need{font-size:13px; color:var(--faint)}

.addrule{display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--line); padding-top:24px}
.addrow{display:flex; gap:8px; flex-wrap:wrap}
.addrow input{flex:1 1 220px; min-width:0; font:inherit; padding:11px 16px; border:1px solid var(--line); border-radius:999px; background:var(--well); color:var(--ink)}
.addrow input::placeholder, textarea::placeholder{color:var(--faint)}
.toast{font-size:13px; color:var(--saffron); min-height:1.2em}

.summary{font-family:var(--display); font-size:clamp(22px,4.6vw,27px); line-height:1.38; text-wrap:pretty}
.summary em{font-style:normal; color:var(--saffron); text-shadow:0 0 20px rgba(246,166,64,.4)}
.summary .h{color:var(--lotus); text-shadow:0 0 20px rgba(238,143,174,.35)}
.obs{display:flex; flex-direction:column; gap:8px; color:var(--muted); padding-left:16px; border-left:1px solid var(--line-2)}
.obs strong{color:var(--ink)}
section.block{display:flex; flex-direction:column; gap:14px}
.legend{display:flex; flex-wrap:wrap; gap:16px; font-size:13px; color:var(--muted)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:7px; vertical-align:-1px}
.bars{display:flex; flex-direction:column; gap:12px; padding:18px; background:var(--glass-2); border:1px solid var(--line); border-radius:16px}
.bar{display:grid; grid-template-columns:150px minmax(0,1fr) 28px; gap:12px; align-items:center; font-size:14px}
.bar .track{display:flex; height:12px; background:var(--well); border-radius:6px; overflow:hidden}
.bar .seg-mine{background:var(--saffron); box-shadow:0 0 10px rgba(246,166,64,.6)}
.bar .seg-drop{background:repeating-linear-gradient(135deg, var(--lotus) 0 4px, rgba(238,143,174,.55) 4px 7px)}
.bar .seg-unsure{background:var(--ash)}
.bar .n{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; color:var(--muted)}
@media (max-width:460px){ .bar{grid-template-columns:1fr 28px} .bar .name{grid-column:1/-1} .bar .track{grid-column:1/2} }

ul.list{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:12px}
.item{background:linear-gradient(165deg, var(--glass), var(--glass-2)); border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:10px}
.item .old{font-family:var(--display); font-size:20px; line-height:1.3}
.item.drop .old{text-decoration:line-through; text-decoration-color:var(--lotus); text-decoration-thickness:1.5px; color:var(--muted)}
.item .meta{font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}
.item label{font-size:13px; font-weight:600; color:var(--lotus)}
.item.drop .field:first-of-type label{color:var(--saffron)}
.item textarea{width:100%; font:inherit; font-size:15px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--well); color:var(--ink); resize:vertical; min-height:44px}
.item .field{display:flex; flex-direction:column; gap:6px}
.item .prompt{font-size:14px; color:var(--muted)}
.empty{font-size:14px; color:var(--faint); font-style:italic}
.maptools{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.confirm{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:14px}
.copyfallback{width:100%; min-height:160px; margin-top:8px; background:var(--well); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px; font:13px/1.5 var(--mono)}

footer.help{border-top:1px solid var(--line); padding-top:20px; font-size:13.5px; color:var(--faint); display:flex; flex-direction:column; gap:6px}
footer.help strong{color:var(--ink)}

@media (prefers-reduced-motion: reduce){ body::before, .stamp{animation:none} .btn, .chip, .choice, .seg button{transition:none} }
</style>
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const SOURCES = [
  {id:'parents', label:'Parents'},
  {id:'family',  label:'Extended family'},
  {id:'school',  label:'School & teachers'},
  {id:'society', label:'Neighbours & society'},
  {id:'faith',   label:'Religion & culture'},
  {id:'peers',   label:'Friends & peers'},
  {id:'media',   label:'Media & internet'},
  {id:'partner', label:'A partner or ex'},
  {id:'self',    label:'My own experience'},
  {id:'unknown', label:"Can't place it"}
];
const PULL = ['Not me','A little','Often','It runs me'];

const RULES = [
  {id:'r1', cat:'Worth', text:"My worth depends on what I achieve.", rw:"I have worth before I achieve anything.", ex:"Do one thing this week only because you enjoy it, with no goal attached."},
  {id:'r2', cat:'Worth', text:"I have to be useful to be loved.", rw:"People can love me even when I'm not helping them.", ex:"Let someone do something for you, and don't pay it back straight away."},
  {id:'r3', cat:'Needs', text:"Don't need too much.", rw:"My needs are normal, and I'm allowed to ask for them.", ex:"Ask one person for one small thing you would usually handle alone."},
  {id:'r4', cat:'Needs', text:"Other people's comfort comes before mine.", rw:"My comfort counts as much as anyone else's.", ex:"Say no to one small request without a long explanation."},
  {id:'r5', cat:'Feelings', text:"Anger is dangerous. Keep it inside.", rw:"Anger tells me a line was crossed. I can say so without hurting anyone.", ex:"Once this week, say calmly: \"I'm annoyed about ___.\""},
  {id:'r6', cat:'Feelings', text:"Crying is weakness.", rw:"Crying is how a body lets pressure out.", ex:"Next time tears come, let them come for one minute before stopping them."},
  {id:'r7', cat:'Feelings', text:"If I show how I really feel, people will leave.", rw:"The right people stay closer when they see the real me.", ex:"Tell one safe person one true feeling you'd normally hide."},
  {id:'r8', cat:'Family', text:"Family matters stay inside the family.", rw:"Getting outside support isn't betrayal.", ex:"Talk about one family worry with someone outside the family."},
  {id:'r9', cat:'Society', text:"What will people say?", rw:"Other people's opinions are information, not orders.", ex:"Make one small choice this week based only on what you prefer."},
  {id:'r10', cat:'Family', text:"Obey elders, even when they're wrong.", rw:"I can respect elders and still disagree with them.", ex:"Voice one respectful disagreement instead of staying silent."},
  {id:'r11', cat:'Family', text:"A good son or daughter gives up their own wants.", rw:"I can care for my family and still have a life of my own.", ex:"Block one hour this week that belongs only to you."},
  {id:'r12', cat:'Success', text:"Success means a stable, respectable job.", rw:"Success is a life I can live with, defined by me.", ex:"Write down three things that would make a year feel successful to you."},
  {id:'r13', cat:'Success', text:"Being compared to others keeps you on track.", rw:"The only fair comparison is with who I was before.", ex:"Notice one comparison this week and replace it with: \"Compared to last year, I…\""},
  {id:'r14', cat:'Love', text:"Love has to be earned.", rw:"Love is not a salary. I don't have to perform for it.", ex:"Spend time with someone close without trying to impress or help them."},
  {id:'r15', cat:'Love', text:"If someone is upset, it's my job to fix it.", rw:"I can care about someone's mood without owning it.", ex:"When someone is upset, ask \"Do you want help or just company?\" before fixing."},
  {id:'r16', cat:'Love', text:"Conflict means the relationship is breaking.", rw:"Repair after conflict is what makes a relationship strong.", ex:"After a small disagreement, go back and talk about it once it's calm."},
  {id:'r17', cat:'Trust', text:"Never trust anyone completely.", rw:"Trust can be built step by step, with people who earn it.", ex:"Share one small, low-risk thing with someone and see how they hold it."},
  {id:'r18', cat:'Self', text:"Being alone means something is wrong with me.", rw:"Time alone is normal, and it can even be good.", ex:"Spend one evening alone on purpose, doing something you like."},
  {id:'r19', cat:'Work', text:"Rest is laziness.", rw:"Rest is part of the work, not a reward for finishing it.", ex:"Take one 20-minute break this week before you feel you've earned it."},
  {id:'r20', cat:'Work', text:"Mistakes are unforgivable.", rw:"Mistakes are how everyone learns, including me.", ex:"Tell someone about one small mistake you made, without over-apologising."},
  {id:'r21', cat:'Safety', text:"Stay small. Don't stand out.", rw:"I'm allowed to take up space.", ex:"Share one opinion or piece of work you'd normally keep to yourself."},
  {id:'r22', cat:'Money', text:"Spending on myself is selfish.", rw:"Looking after myself, including with money, is responsible.", ex:"Spend a small, planned amount on something just for you, without guilt."},
  {id:'r23', cat:'Body', text:"My body is something to fix.", rw:"My body is where I live, not a project.", ex:"Do one thing for your body this week because it feels good, not to change it."},
  {id:'r24', cat:'Roles', text:"My gender decides what I'm allowed to feel or want.", rw:"My feelings and wants aren't decided by my gender.", ex:"Notice one thing you want but hold back on because of your gender, and take one step toward it."}
];

const KEY = 'inherited-rules-v1';
let S = load() || {answers:{}, custom:[], idx:0, view:'deck'};
let ui = {confirmReset:false, toast:''};

function load(){ try{ const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null }catch(e){ return null } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){} }
function deck(){ return RULES.concat(S.custom) }
function ans(id){ return S.answers[id] || (S.answers[id] = {pull:null, sources:[], choice:null, rw:null, ex:null}) }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function srcLabel(id){ const s = SOURCES.find(x=>x.id===id); return s ? s.label : id }
function complete(a){ return a && (a.pull===0 || (a.pull>0 && a.sources.length>0 && !!a.choice)) }
function status(a){ if(!complete(a)) return ''; if(a.pull===0) return 'notme'; return a.choice }
function answeredCount(){ return deck().filter(r => complete(S.answers[r.id])).length }
const tilt = [-4,3,-2,5,-5,2,-3,4,-1,3];

function render(){
  const app = document.getElementById('app');
  app.innerHTML = (S.view==='map' ? mapView() : deckView()) + helpFooter();
  save();
}

function header(){
  const n = answeredCount();
  return `<header class="top">
    <div class="toprow"><span class="brand"><span class="dot" aria-hidden="true"></span>Samskara</span>
    ${S.view==='deck' ? (n>=3 ? `<button class="linkbtn" data-act="map">See my map (${n} sorted)</button>` : '') : `<button class="linkbtn" data-act="deck">Back to the deck</button>`}</div>
    ${S.view==='deck' ? `<h1>Which of your rules did you <span class="glow">actually choose?</span></h1>
    <p class="lede">Some rules you live by were handed to you long before you could question them. Sort each card: how much it steers you, where you picked it up, and whether you'd choose it today.</p>
    <p class="privacy">Nothing leaves this page. Your progress is saved only in this browser.</p>` : ''}
  </header>`;
}

function deckView(){
  const d = deck(); if(S.idx>=d.length) S.idx = d.length-1; if(S.idx<0) S.idx=0;
  const r = d[S.idx]; const a = ans(r.id);
  const ticks = d.map((x,i)=>`<span class="tick ${status(S.answers[x.id])} ${i===S.idx?'current':''}" title="${esc(x.text)}"></span>`).join('');
  const stamps = a.pull>0 && a.sources.length
    ? a.sources.map((s,i)=>`<span class="stamp ${s==='self'?'self':''}" style="--r:${tilt[i%tilt.length]}deg">${esc(srcLabel(s))}</span>`).join('')
    : `<span class="hint">${a.pull===0 ? 'Set aside: not part of you.' : 'Where it came from will be stamped here.'}</span>`;
  const isLast = S.idx===d.length-1;
  let need = '';
  if(a.pull===null) need = 'Pick how much it steers you.';
  else if(a.pull>0 && !a.sources.length) need = 'Pick at least one place it came from.';
  else if(a.pull>0 && !a.choice) need = 'Decide whether you choose it today.';

  return header() + `
  <div class="ticks" aria-label="Progress">${ticks}</div>
  <article class="card" aria-live="polite">
    <div class="card-top"><span class="label">${esc(r.cat)}</span><span class="label">${String(S.idx+1).padStart(2,'0')} / ${d.length}</span></div>
    <p class="rule">“${esc(r.text)}”</p>
    <div class="stamps">${stamps}</div>
  </article>

  <div class="q">
    <span class="qtitle">How much does this rule steer you today?</span>
    <div class="seg">${PULL.map((p,i)=>`<button id="pull-${i}" data-pull="${i}" aria-pressed="${a.pull===i}">${p}</button>`).join('')}</div>
  </div>

  ${a.pull>0 ? `
  <div class="q">
    <span class="qtitle">Where did you pick it up? <span class="need">Choose all that fit.</span></span>
    <div class="chips">${SOURCES.map(s=>`<button id="src-${s.id}" class="chip ${s.id==='self'?'self':''}" data-src="${s.id}" aria-pressed="${a.sources.includes(s.id)}">${s.label}</button>`).join('')}</div>
  </div>
  <div class="q">
    <span class="qtitle">Seeing where it came from, do you choose it today?</span>
    <div class="choices">
      <button id="ch-mine" class="choice c-mine" data-choice="mine" aria-pressed="${a.choice==='mine'}"><strong>Mine</strong><span>I'd pick this even if no one had taught me.</span></button>
      <button id="ch-drop" class="choice c-drop" data-choice="drop" aria-pressed="${a.choice==='drop'}"><strong>Handed to me</strong><span>I carry it, but I wouldn't choose it.</span></button>
      <button id="ch-unsure" class="choice c-unsure" data-choice="unsure" aria-pressed="${a.choice==='unsure'}"><strong>Not sure yet</strong><span>I need to think about this one.</span></button>
    </div>
  </div>` : ''}

  <div class="nav">
    <button class="btn ghost" data-act="prev" ${S.idx===0?'disabled':''}>Previous</button>
    <span class="need">${need}</span>
    <button class="btn" data-act="next" ${complete(a)?'':'disabled'}>${isLast ? 'See my map' : 'Next card'}</button>
  </div>

  <form class="addrule" id="addform">
    <label class="qtitle" for="custom-rule">Grew up with a rule that isn't here?</label>
    <div class="addrow"><input id="custom-rule" maxlength="140" placeholder="e.g. Never ask for help with money" autocomplete="off"><button class="btn ghost" type="submit">Add to deck</button></div>
    <span class="toast">${esc(ui.toast)}</span>
  </form>`;
}

function mapView(){
  const d = deck();
  const done = d.filter(r => complete(S.answers[r.id]));
  const carried = done.filter(r => S.answers[r.id].pull>0);
  const mine = carried.filter(r => S.answers[r.id].choice==='mine');
  const drop = carried.filter(r => S.answers[r.id].choice==='drop');
  const unsure = carried.filter(r => S.answers[r.id].choice==='unsure');
  const notme = done.length - carried.length;
  const byPull = (x,y) => S.answers[y.id].pull - S.answers[x.id].pull;

  // source counts
  const counts = SOURCES.map(s => {
    const c = {id:s.id, label:s.label, mine:0, drop:0, unsure:0};
    carried.forEach(r => { const a = S.answers[r.id]; if(a.sources.includes(s.id)) c[a.choice]++ });
    c.total = c.mine + c.drop + c.unsure; return c;
  }).filter(c => c.total>0).sort((a,b)=> b.total-a.total);
  const max = Math.max(1, ...counts.map(c=>c.total));

  // observations
  const obs = [];
  const dropTop = counts.filter(c=>c.drop>0).sort((a,b)=>b.drop-a.drop)[0];
  if(dropTop && dropTop.id!=='self') obs.push(`Most of the rules you'd put down came from <strong>${esc(dropTop.label.toLowerCase())}</strong> (${dropTop.drop} of ${drop.length}).`);
  const selfC = counts.find(c=>c.id==='self');
  if(selfC && selfC.mine>0) obs.push(`${selfC.mine} of the rules you keep are backed by your own experience, not only by what you were told.`);
  const heavyDrop = drop.filter(r=>S.answers[r.id].pull===3).length;
  if(heavyDrop) obs.push(`${heavyDrop} rule${heavyDrop>1?'s':''} you wouldn't choose still run${heavyDrop>1?'':'s'} you strongly. Those are the best place to start.`);

  const srcText = a => a.sources.map(srcLabel).join(', ');
  const dropItems = drop.sort(byPull).map(r => { const a=S.answers[r.id];
    const rw = a.rw!==null ? a.rw : (r.rw||''); const ex = a.ex!==null ? a.ex : (r.ex||'');
    return `<li class="item drop">
      <span class="old">${esc(r.text)}</span>
      <span class="meta">From ${esc(srcText(a))} · ${PULL[a.pull]}</span>
      <div class="field"><label for="rw-${r.id}">Your version</label><textarea id="rw-${r.id}" data-rw="${r.id}" rows="2" placeholder="Write the rule you'd choose instead">${esc(rw)}</textarea></div>
      <div class="field"><label for="ex-${r.id}">Try this week</label><textarea id="ex-${r.id}" data-ex="${r.id}" rows="2" placeholder="One small action that bends the old rule">${esc(ex)}</textarea></div>
    </li>` }).join('');
  const mineItems = mine.sort(byPull).map(r => { const a=S.answers[r.id];
    return `<li class="item mine"><span class="old">${esc(r.text)}</span><span class="meta">From ${esc(srcText(a))} · ${PULL[a.pull]}</span>
      <p class="prompt">You chose to keep this one. Does it ever cost you more than it gives?</p></li>` }).join('');
  const unsureItems = unsure.sort(byPull).map(r => { const a=S.answers[r.id];
    return `<li class="item"><span class="old">${esc(r.text)}</span><span class="meta">From ${esc(srcText(a))} · ${PULL[a.pull]}</span>
      <p class="prompt">Ask yourself: if no one had taught me this, would I arrive at it on my own? Who benefits when I follow it?</p></li>` }).join('');

  const summary = carried.length
    ? `You sorted ${done.length} rules. <span>${carried.length}</span> still steer you. You'd choose <em>${mine.length}</em> of them as your own, and <span class="h">${drop.length}</span> were handed to you${unsure.length ? `. ${unsure.length} you're still deciding` : ''}.`
    : `You sorted ${done.length} rules and set all of them aside as not part of you.`;

  return header() + `
  <section class="block">
    <h1>Your map</h1>
    <p class="summary">${summary}</p>
    ${obs.length ? `<div class="obs">${obs.map(o=>`<p>${o}</p>`).join('')}</div>` : ''}
  </section>

  ${counts.length ? `<section class="block">
    <h2>Where your rules came from</h2>
    <div class="legend"><span><i style="background:var(--saffron)"></i>Mine</span><span><i style="background:var(--lotus)"></i>Handed to me</span><span><i style="background:var(--ash)"></i>Not sure</span></div>
    <div class="bars">${counts.map(c=>`<div class="bar"><span class="name">${esc(c.label)}</span>
      <div class="track" role="img" aria-label="${esc(c.label)}: ${c.mine} mine, ${c.drop} handed down, ${c.unsure} not sure">
        <div class="seg-mine" style="width:${c.mine/max*100}%"></div><div class="seg-drop" style="width:${c.drop/max*100}%"></div><div class="seg-unsure" style="width:${c.unsure/max*100}%"></div>
      </div><span class="n">${c.total}</span></div>`).join('')}</div>
    <p class="need">A rule can come from more than one place, so the counts can add up to more than the number of rules.</p>
  </section>` : ''}

  <section class="block">
    <h2>Handed to you</h2>
    <p class="lede">Rules you carry but wouldn't choose. Each has a suggested rewrite and a small experiment. Edit both until they sound like you.</p>
    ${dropItems ? `<ul class="list">${dropItems}</ul>` : `<p class="empty">None yet.</p>`}
  </section>

  <section class="block">
    <h2>Yours</h2>
    ${mineItems ? `<ul class="list">${mineItems}</ul>` : `<p class="empty">None yet.</p>`}
  </section>

  ${unsureItems ? `<section class="block"><h2>Still deciding</h2><ul class="list">${unsureItems}</ul></section>` : ''}

  ${notme ? `<p class="need">${notme} rule${notme>1?'s':''} set aside as not part of you.</p>` : ''}

  <div class="maptools">
    <button class="btn" data-act="copy">Copy my map as text</button>
    <button class="btn ghost" data-act="deck">Keep sorting</button>
    ${ui.confirmReset
      ? `<span class="confirm">This clears every answer saved in this browser. <button class="btn ghost" data-act="reset-yes">Clear everything</button><button class="linkbtn" data-act="reset-no">Keep my answers</button></span>`
      : `<button class="linkbtn" data-act="reset">Start over</button>`}
    <span class="toast" id="copytoast"></span>
  </div>`;
}

function helpFooter(){
  return `<footer class="help">
    <span>This is a reflection tool, not therapy or a diagnosis. Old rules often formed for good reasons, so go gently.</span>
    <span>If things feel heavy right now, you can talk to someone. In India, <strong>Tele-MANAS: 14416</strong> or <strong>1-800-891-4416</strong> (free, 24/7). Elsewhere: <a href="https://findahelpline.com" target="_blank" rel="noopener">findahelpline.com</a>.</span>
  </footer>`;
}

function mapText(){
  const d = deck(); const lines = ['SAMSKARA: MY RULES MAP',''];
  const group = (title, ch) => {
    const rs = d.filter(r => { const a=S.answers[r.id]; return complete(a) && a.pull>0 && a.choice===ch });
    if(!rs.length) return; lines.push(title);
    rs.forEach(r => { const a=S.answers[r.id];
      lines.push(`- ${r.text}  (from ${a.sources.map(srcLabel).join(', ')}; ${PULL[a.pull]})`);
      if(ch==='drop'){ const rw=a.rw!==null?a.rw:r.rw, ex=a.ex!==null?a.ex:r.ex;
        if(rw) lines.push(`    My version: ${rw}`); if(ex) lines.push(`    Try this week: ${ex}`); }
    }); lines.push('');
  };
  group('HANDED TO ME','drop'); group('MINE','mine'); group('STILL DECIDING','unsure');
  return lines.join('\n');
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const d = deck(); const r = d[S.idx];
  if(b.dataset.pull!==undefined){ const a=ans(r.id); a.pull=+b.dataset.pull; if(a.pull===0){a.sources=[];a.choice=null} render(); document.getElementById('pull-'+a.pull)?.focus(); return }
  if(b.dataset.src){ const a=ans(r.id); const s=b.dataset.src; a.sources = a.sources.includes(s) ? a.sources.filter(x=>x!==s) : a.sources.concat(s); render(); document.getElementById('src-'+s)?.focus(); return }
  if(b.dataset.choice){ const a=ans(r.id); a.choice=b.dataset.choice; render(); document.getElementById('ch-'+a.choice)?.focus(); return }
  const act = b.dataset.act; if(!act) return;
  if(act==='next'){ if(S.idx < d.length-1){ S.idx++; ui.toast='' } else { S.view='map' } render(); window.scrollTo({top:0}); }
  else if(act==='prev'){ S.idx=Math.max(0,S.idx-1); ui.toast=''; render(); }
  else if(act==='map'){ S.view='map'; render(); window.scrollTo({top:0}); }
  else if(act==='deck'){ S.view='deck'; ui.confirmReset=false; const first = d.findIndex(x=>!complete(S.answers[x.id])); if(first>=0) S.idx=first; render(); window.scrollTo({top:0}); }
  else if(act==='reset'){ ui.confirmReset=true; render(); }
  else if(act==='reset-no'){ ui.confirmReset=false; render(); }
  else if(act==='reset-yes'){ S={answers:{}, custom:[], idx:0, view:'deck'}; ui.confirmReset=false; render(); window.scrollTo({top:0}); }
  else if(act==='copy'){
    const t = document.getElementById('copytoast'); const text = mapText();
    const fallback = () => { const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.className='copyfallback'; t.textContent='Copy blocked here. Select the text below and copy it.'; t.after(ta); ta.select(); };
    try{ navigator.clipboard.writeText(text).then(()=>{ t.textContent='Copied.' }, fallback) }catch(err){ fallback() }
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.rw){ ans(el.dataset.rw).rw = el.value; save() }
  if(el.dataset.ex){ ans(el.dataset.ex).ex = el.value; save() }
});

document.addEventListener('submit', e => {
  if(e.target.id!=='addform') return; e.preventDefault();
  const inp = document.getElementById('custom-rule'); const text = inp.value.trim().replace(/\.?$/, '.');
  if(text.length < 4){ ui.toast='Write the rule in a few words first.'; render(); return }
  const id = 'c' + Date.now();
  S.custom.push({id, cat:'Your own', text, rw:'', ex:''});
  ui.toast = `Added as card ${deck().length}. You'll reach it at the end of the deck.`;
  render();
});

render();
</script>

</body>
</html>
